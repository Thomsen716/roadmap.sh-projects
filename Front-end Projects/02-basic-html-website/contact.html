<!doctype html>
<html lang="en">
  <head>
    <!--SEO Meta Tags-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thomsen - Basic HTML website</title>

    <meta name="author" content="Thomsen" />
    <meta
      name="description"
      content="a place to contact information for the user of the portfolio website"
    />
    <meta
      name="keywords"
      content="HTML, frontend developer, portfolio, web development, contact"
    />

    <!--Favicon-->
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
  </head>
  <body>
    <header>
      <div class="1">
        <img src="logo.png" alt="" width="50" height="50" />
      </div>

      <nav>
        <a href="index.html">Home</a> | <a href="projects.html">Projects</a> |
        <a href="articles.html">Articles</a> |
        <a href="contact.html">Contact</a>
      </nav>
      <hr />
    </header>

    <main>
      <section id="contact-me">
        <form action="https//:test" method="get">
          <fieldset>
            <legend><h1>Contact me</h1></legend>
            <label for="name">Name:</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Johndoe"
              autocomplete="on"
              required
            />

            <label for="email">E-mail:</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="noreply@example.com"
              required
            />
            <br />
            <br />
            <label for="message">Message:</label>
            <br />
            <textarea
              name="message"
              id="message"
              cols="50"
              rows="10"
              placeholder="Type your message here"
            ></textarea>
            <br />
            <button type="submit">Send</button>
          </fieldset>
        </form>
      </section>
    </main>
    <footer>
      <br />
      <code>&copy; All rights Reserved 2026</code>
    </footer>
  </body>
</html>
